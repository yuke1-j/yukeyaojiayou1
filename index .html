<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="雷松奇 · 黑龙江大学自动化专业 2026 级本科生，聚焦人工智能应用与高潜保研规划。">
<meta name="theme-color" content="#4f46e5">
<title>雷松奇 · 个人简历</title>
<script>
/* 首屏应用主题，避免闪烁 */
(function () {
  try {
    var t = localStorage.getItem('lq-theme');
    if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<style>
/* ============================================================
   设计令牌
   ============================================================ */
:root {
  --bg: #f5f6fb;
  --dot: rgba(15, 23, 42, .045);
  --glow-a: rgba(79, 70, 229, .11);
  --glow-b: rgba(6, 182, 212, .10);

  --card: #ffffff;
  --solid: #ffffff;

  --text: #0f172a;
  --text-2: #3d4759;
  --muted: #6b7688;

  --border: rgba(15, 23, 42, .09);
  --border-2: rgba(15, 23, 42, .16);
  --hover: rgba(15, 23, 42, .045);

  --primary: #4f46e5;
  --primary-soft: rgba(79, 70, 229, .09);
  --primary-line: rgba(79, 70, 229, .30);

  --accent: #06b6d4;
  --accent-soft: rgba(6, 182, 212, .10);

  --grad: linear-gradient(120deg, #4f46e5 0%, #06b6d4 100%);

  --sh-sm: 0 1px 2px rgba(15, 23, 42, .05), 0 8px 22px -14px rgba(15, 23, 42, .28);
  --sh-md: 0 2px 6px rgba(15, 23, 42, .05), 0 18px 42px -18px rgba(15, 23, 42, .30);
  --sh-lg: 0 4px 12px rgba(15, 23, 42, .06), 0 28px 56px -22px rgba(79, 70, 229, .40);

  --nav-bg: rgba(245, 246, 251, .80);

  --r-lg: 18px;
  --r-md: 13px;
  --r-sm: 10px;

  --ease: cubic-bezier(.22, .75, .28, 1);
}

[data-theme="dark"] {
  --bg: #080c18;
  --dot: rgba(255, 255, 255, .042);
  --glow-a: rgba(99, 102, 241, .20);
  --glow-b: rgba(34, 211, 238, .13);

  --card: rgba(255, 255, 255, .042);
  --solid: #121a2e;

  --text: #e8ecf7;
  --text-2: #c0c9dc;
  --muted: #8892a8;

  --border: rgba(255, 255, 255, .09);
  --border-2: rgba(255, 255, 255, .18);
  --hover: rgba(255, 255, 255, .06);

  --primary: #818cf8;
  --primary-soft: rgba(129, 140, 248, .14);
  --primary-line: rgba(129, 140, 248, .36);

  --accent: #22d3ee;
  --accent-soft: rgba(34, 211, 238, .13);

  --grad: linear-gradient(120deg, #818cf8 0%, #22d3ee 100%);

  --sh-sm: 0 1px 2px rgba(0, 0, 0, .32), 0 8px 22px -14px rgba(0, 0, 0, .60);
  --sh-md: 0 2px 6px rgba(0, 0, 0, .32), 0 18px 42px -18px rgba(0, 0, 0, .75);
  --sh-lg: 0 4px 12px rgba(0, 0, 0, .38), 0 28px 56px -22px rgba(99, 102, 241, .48);

  --nav-bg: rgba(8, 12, 24, .78);
}

/* ============================================================
   基础
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  scroll-padding-top: 84px;
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
               "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  font-size: 15px;
  line-height: 1.7;
  color: var(--text);
  background-color: var(--bg);
  background-image:
    radial-gradient(880px 520px at 8% -12%, var(--glow-a), transparent 62%),
    radial-gradient(760px 500px at 95% -2%, var(--glow-b), transparent 62%),
    radial-gradient(var(--dot) 1px, transparent 1px);
  background-size: auto, auto, 26px 26px;
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
  transition: background-color .3s var(--ease), color .3s var(--ease);
}

h1, h2, h3, h4, p, ul, figure { margin: 0; }
ul { padding: 0; list-style: none; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
svg { display: block; }

::selection { background: var(--primary); color: #fff; }

:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
  border-radius: 6px;
}

.wrap {
  width: 100%;
  max-width: 1080px;
  margin: 0 auto;
  padding: 0 24px;
}

.skip {
  position: absolute; left: -9999px; top: 0; z-index: 300;
  padding: 10px 16px; border-radius: 0 0 12px 0;
  background: var(--primary); color: #fff; font-weight: 600;
}
.skip:focus { left: 0; }

/* ============================================================
   导航
   ============================================================ */
.nav {
  position: sticky; top: 0; z-index: 80;
  background: var(--nav-bg);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
  backdrop-filter: blur(16px) saturate(180%);
  border-bottom: 1px solid var(--border);
  transition: background .3s var(--ease), border-color .3s var(--ease);
}

.nav-inner {
  max-width: 1080px; margin: 0 auto; padding: 0 24px;
  height: 66px; display: flex; align-items: center; gap: 14px;
}

.brand {
  display: flex; align-items: center; gap: 9px;
  flex-shrink: 0; font-weight: 700; font-size: 15px; letter-spacing: .01em;
}
.brand-mark {
  width: 28px; height: 28px; border-radius: 9px;
  display: grid; place-items: center;
  font-size: 13px; font-weight: 800; color: #fff;
  background: var(--grad);
  box-shadow: 0 6px 16px -6px var(--primary);
}

.nav-links {
  display: flex; align-items: center; gap: 2px; margin-left: auto;
  overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none;
}
.nav-links::-webkit-scrollbar { display: none; }
.nav-links a {
  padding: 8px 13px; border-radius: var(--r-sm);
  font-size: 13.5px; font-weight: 500; color: var(--muted);
  white-space: nowrap;
  transition: color .18s var(--ease), background .18s var(--ease);
}
.nav-links a:hover { color: var(--text); background: var(--primary-soft); }
.nav-links a.active { color: var(--primary); background: var(--primary-soft); font-weight: 600; }

.nav-tools { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.tool {
  width: 38px; height: 38px; border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text-2);
  cursor: pointer;
  display: grid; place-items: center;
  transition: transform .18s var(--ease), border-color .18s var(--ease),
              color .18s var(--ease), background .18s var(--ease),
              box-shadow .18s var(--ease);
}
.tool:hover {
  color: var(--primary);
  border-color: var(--primary-line);
  box-shadow: var(--sh-sm);
  transform: translateY(-1px);
}
.tool:active { transform: translateY(0) scale(.95); }

.ico-sun { display: none; }
[data-theme="dark"] .ico-sun { display: block; }
[data-theme="dark"] .ico-moon { display: none; }

/* ============================================================
   Hero
   ============================================================ */
.hero { padding: 76px 0 54px; }

.hero-eyebrow {
  display: inline-flex; align-items: center; gap: 9px;
  padding: 7px 15px; border-radius: 99px;
  font-size: 12.5px; font-weight: 600;
  color: var(--text-2);
  background: var(--card);
  border: 1px solid var(--border);
  box-shadow: var(--sh-sm);
}
.pulse {
  width: 7px; height: 7px; border-radius: 50%;
  background: #22c55e; flex-shrink: 0;
  animation: pulse 2.4s cubic-bezier(.4, 0, .6, 1) infinite;
}
@keyframes pulse {
  0%   { box-shadow: 0 0 0 0 rgba(34, 197, 94, .55); }
  70%  { box-shadow: 0 0 0 9px rgba(34, 197, 94, 0); }
  100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
}

.hero-name {
  margin-top: 22px;
  font-size: clamp(42px, 7.6vw, 66px);
  font-weight: 800;
  line-height: 1.06;
  letter-spacing: -.03em;
  width: fit-content;
  background: linear-gradient(116deg, var(--text) 16%, var(--primary) 58%, var(--accent) 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}

.hero-sub {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  margin-top: 16px;
  font-size: 14.5px; font-weight: 500; color: var(--text-2);
}
.hero-tag {
  font-size: 11.5px; font-weight: 700; letter-spacing: .09em;
  color: var(--primary);
  background: var(--primary-soft);
  border: 1px solid var(--primary-line);
  padding: 4px 11px; border-radius: 8px;
}

.hero-desc {
  max-width: 680px; margin-top: 20px;
  font-size: 15px; line-height: 1.95; color: var(--muted);
}

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
.chip {
  font-size: 12.5px; font-weight: 500;
  padding: 6px 13px; border-radius: 99px;
  color: var(--text-2);
  background: var(--card);
  border: 1px solid var(--border);
  transition: transform .18s var(--ease), border-color .18s var(--ease),
              color .18s var(--ease), box-shadow .18s var(--ease);
}
.chip:hover {
  transform: translateY(-2px);
  color: var(--primary);
  border-color: var(--primary-line);
  box-shadow: var(--sh-sm);
}

.hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }

/* ============================================================
   按钮
   ============================================================ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 20px; border-radius: var(--r-md);
  font-size: 14px; font-weight: 600; letter-spacing: .01em;
  border: 1px solid transparent; cursor: pointer; white-space: nowrap;
  transition: transform .18s var(--ease), box-shadow .18s var(--ease),
              background .18s var(--ease), border-color .18s var(--ease),
              color .18s var(--ease);
}
.btn-primary {
  color: #fff; background: var(--grad);
  box-shadow: 0 10px 24px -10px var(--primary);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 16px 32px -12px var(--primary); }
.btn-ghost {
  color: var(--text); background: var(--card);
  border-color: var(--border); box-shadow: var(--sh-sm);
}
.btn-ghost:hover {
  color: var(--primary); border-color: var(--primary-line);
  transform: translateY(-2px);
}
.btn:active { transform: translateY(0) scale(.985); }
.btn svg { flex-shrink: 0; }

/* ============================================================
   区块 / 卡片
   ============================================================ */
.section { padding: 54px 0; }

.sec-head {
  display: flex; align-items: center; gap: 14px; margin-bottom: 26px;
}
.sec-idx {
  font-size: 12px; font-weight: 800; letter-spacing: .14em;
  color: var(--primary); font-variant-numeric: tabular-nums;
}
.sec-head h2 {
  font-size: clamp(20px, 3vw, 25px);
  font-weight: 750; letter-spacing: -.02em; white-space: nowrap;
}
.sec-line {
  flex: 1; height: 1px; min-width: 20px;
  background: linear-gradient(90deg, var(--border-2), transparent);
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--sh-sm);
  transition: transform .22s var(--ease), box-shadow .22s var(--ease),
              border-color .22s var(--ease);
}
.card:hover {
  transform: translateY(-3px);
  box-shadow: var(--sh-md);
  border-color: var(--primary-line);
}

/* ============================================================
   亮点成果
   ============================================================ */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(206px, 1fr));
  gap: 16px;
}

.stat {
  position: relative; overflow: hidden;
  padding: 22px;
  border-radius: var(--r-lg);
  background: var(--card);
  border: 1px solid var(--border);
  box-shadow: var(--sh-sm);
  transition: transform .22s var(--ease), box-shadow .22s var(--ease),
              border-color .22s var(--ease);
}
.stat::after {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 3px;
  background: var(--grad); opacity: 0;
  transition: opacity .22s var(--ease);
}
.stat:hover {
  transform: translateY(-4px);
  box-shadow: var(--sh-lg);
  border-color: var(--primary-line);
}
.stat:hover::after { opacity: 1; }

.stat-value {
  font-size: 27px; font-weight: 800; line-height: 1.15;
  letter-spacing: -.025em; width: fit-content;
  background: var(--grad);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
.stat-label { margin-top: 9px; font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
.stat-desc { margin-top: 8px; font-size: 13px; line-height: 1.7; color: var(--muted); }

/* ============================================================
   Tabs
   ============================================================ */
.tablist {
  display: inline-flex; flex-wrap: wrap; gap: 4px;
  padding: 4px; margin-bottom: 24px;
  border-radius: var(--r-md);
  background: var(--primary-soft);
  border: 1px solid var(--border);
}
.tab {
  border: none; background: transparent; cursor: pointer;
  padding: 8px 17px; border-radius: var(--r-sm);
  font-size: 13.5px; font-weight: 600; color: var(--muted);
  white-space: nowrap;
  transition: color .18s var(--ease), background .18s var(--ease),
              box-shadow .18s var(--ease);
}
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] {
  color: var(--primary); background: var(--card);
  box-shadow: 0 1px 3px rgba(0, 0, 0, .10);
}

.tabpanel[hidden] { display: none; }
.tabpanel { animation: panelIn .3s var(--ease) both; }
@keyframes panelIn {
  from { opacity: 0; transform: translateY(9px); }
  to   { opacity: 1; transform: none; }
}

/* ============================================================
   时间线
   ============================================================ */
.timeline {
  position: relative; display: grid; gap: 16px; padding-left: 26px;
}
.timeline::before {
  content: ""; position: absolute; left: 5px; top: 14px; bottom: 14px;
  width: 2px; border-radius: 2px;
  background: linear-gradient(180deg, var(--primary), var(--accent), transparent);
  opacity: .32;
}
.tl-item { position: relative; }
.tl-item::before {
  content: ""; position: absolute; left: -25px; top: 26px;
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--solid);
  border: 2px solid var(--primary);
  box-shadow: 0 0 0 4px var(--primary-soft);
}

.tl-card { padding: 22px; }
.tl-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; }
.tl-org {
  font-size: 15.5px; font-weight: 750; letter-spacing: -.015em;
  flex: 1; min-width: 170px;
}
.tl-period {
  font-size: 12.5px; color: var(--muted);
  font-variant-numeric: tabular-nums; white-space: nowrap;
  padding: 3px 11px; border-radius: 99px;
  background: var(--primary-soft);
  border: 1px solid var(--primary-line);
}
.tl-role { margin-top: 6px; font-size: 12.8px; font-weight: 600; color: var(--primary); }

.points { display: grid; gap: 7px; margin-top: 13px; }
.points li {
  position: relative; padding-left: 16px;
  font-size: 13.8px; line-height: 1.78; color: var(--text-2);
}
.points li::before {
  content: ""; position: absolute; left: 0; top: .68em;
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--primary); opacity: .55;
}

.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 15px; }
.tag {
  font-size: 11.5px; font-weight: 600;
  padding: 3px 10px; border-radius: 99px;
  color: var(--primary);
  background: var(--primary-soft);
  border: 1px solid var(--primary-line);
}

/* ============================================================
   项目
   ============================================================ */
.proj-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 18px;
}
.proj { display: flex; flex-direction: column; padding: 24px; }
.proj-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; }
.proj-name {
  flex: 1; min-width: 170px;
  font-size: 15.5px; font-weight: 750;
  letter-spacing: -.015em; line-height: 1.45;
}
.proj-period {
  font-size: 12px; color: var(--muted);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.proj-role { margin-top: 7px; font-size: 12.5px; font-weight: 600; color: var(--primary); }
.proj-desc { margin-top: 12px; font-size: 13.5px; line-height: 1.8; color: var(--muted); }
.proj .points li { font-size: 13.4px; }
.proj .tags { margin-top: auto; padding-top: 16px; }

/* ============================================================
   技能
   ============================================================ */
.skill-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(272px, 1fr));
  gap: 18px;
}
.skill-card { padding: 24px; }
.skill-group {
  display: flex; align-items: center; gap: 9px;
  margin-bottom: 18px;
  font-size: 14px; font-weight: 750; letter-spacing: -.01em;
}
.skill-group::before {
  content: ""; width: 4px; height: 15px; border-radius: 3px;
  background: var(--grad); flex-shrink: 0;
}
.skill-row { margin-bottom: 15px; }
.skill-row:last-child { margin-bottom: 0; }
.skill-label {
  display: flex; justify-content: space-between; gap: 12px;
  margin-bottom: 7px; font-size: 13px; color: var(--text-2);
}
.skill-pct {
  font-size: 11.5px; color: var(--muted);
  font-variant-numeric: tabular-nums; flex-shrink: 0;
}
.bar { height: 6px; border-radius: 99px; background: var(--primary-soft); overflow: hidden; }
.bar-fill {
  height: 100%; width: 0; border-radius: 99px;
  background: var(--grad);
  transition: width .9s var(--ease);
}

/* ============================================================
   ★ 作品集
   ============================================================ */
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 16px;
}

.gallery-item {
  position: relative;
  display: block;
  margin: 0;
  aspect-ratio: 4 / 3;
  border-radius: var(--r-md);
  overflow: hidden;
  background: var(--primary-soft);
  border: 1px solid var(--border);
  cursor: zoom-in;
  transition: transform .22s var(--ease), box-shadow .22s var(--ease),
              border-color .22s var(--ease);
}
.gallery-item:hover,
.gallery-item:focus-visible {
  transform: translateY(-4px);
  box-shadow: var(--sh-lg);
  border-color: var(--primary-line);
}

.gallery-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform .45s var(--ease);
}
.gallery-item:hover img { transform: scale(1.06); }

.gallery-cap {
  position: absolute;
  inset: auto 0 0 0;
  padding: 28px 14px 12px;
  background: linear-gradient(180deg, transparent, rgba(3, 7, 18, .82));
  color: #fff;
  font-size: 12.5px;
  font-weight: 600;
  line-height: 1.45;
  letter-spacing: .01em;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity .26s var(--ease), transform .26s var(--ease);
  pointer-events: none;
}
.gallery-item:hover .gallery-cap,
.gallery-item:focus-visible .gallery-cap {
  opacity: 1;
  transform: none;
}

/* 图片加载失败时的占位 */
.gallery-ph {
  display: none;
  position: absolute;
  inset: 0;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 16px;
  text-align: center;
  color: var(--muted);
  font-size: 11.5px;
  line-height: 1.6;
  word-break: break-all;
}
.gallery-item.is-error {
  cursor: default;
  background: var(--primary-soft);
  border-style: dashed;
}
.gallery-item.is-error img { display: none; }
.gallery-item.is-error .gallery-cap { display: none; }
.gallery-item.is-error .gallery-ph { display: flex; }
.gallery-item.is-error:hover {
  transform: none;
  box-shadow: var(--sh-sm);
  border-color: var(--border);
}

/* ============================================================
   ★ Lightbox 大图查看器
   ============================================================ */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: grid;
  place-items: center;
  padding: 70px 20px 46px;
  background: rgba(6, 8, 15, .93);
  -webkit-backdrop-filter: blur(12px) saturate(140%);
  backdrop-filter: blur(12px) saturate(140%);
  opacity: 0;
  visibility: hidden;
  transition: opacity .28s var(--ease), visibility .28s;
}
.lightbox.show { opacity: 1; visibility: visible; }

.lb-figure {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  max-width: 100%;
  max-height: 100%;
}

.lb-img {
  max-width: min(1120px, 100%);
  max-height: calc(100vh - 172px);
  max-height: calc(100dvh - 172px);
  border-radius: 12px;
  object-fit: contain;
  background: rgba(255, 255, 255, .04);
  box-shadow: 0 30px 80px rgba(0, 0, 0, .6);
}

.lb-cap {
  display: flex;
  align-items: center;
  gap: 14px;
  color: rgba(255, 255, 255, .88);
  font-size: 13px;
  font-weight: 500;
  text-align: center;
}
.lb-count {
  flex-shrink: 0;
  padding: 2px 10px;

  border-color: var(--primary-line);
}

  flex-shrink: 0; width: 36px; height: 36px; border-radius: 11px;

  color: var(--primary);
  background: var(--primary-soft);
  border: 1px solid var(--primary-line);

   页脚
   ============================================================ */

/* ============================================================
   返回顶部 / Toast
   ============================================================ */
.to-top {
  position: fixed; right: 22px; bottom: 22px; z-index: 90;
  width: 46px; height: 46px; border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--card);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  color: var(--text); cursor: pointer;
  display: grid; place-items: center;
  box-shadow: var(--sh-md);
  opacity: 0; transform: translateY(16px); pointer-events: none;
  transition: opacity .25s var(--ease), transform .25s var(--ease),
              border-color .2s var(--ease), color .2s var(--ease);
}
.to-top.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
.to-top:hover {
  color: var(--primary); border-color: var(--primary-line);
  transform: translateY(-3px);
}
.to-top:active { transform: translateY(0) scale(.94); }

.toast {
  position: fixed; left: 50%; bottom: 30px; z-index: 210;
  max-width: calc(100vw - 32px);
  padding: 11px 21px; border-radius: 12px;
  font-size: 13.5px; font-weight: 600; text-align: center;
  color: #fff; background: #111827;
  box-shadow: 0 16px 40px -12px rgba(0, 0, 0, .5);
  opacity: 0; pointer-events: none;
  transform: translate(-50%, 18px);
  transition: opacity .26s var(--ease), transform .26s var(--ease);
}
[data-theme="dark"] .toast { background: #e8ecf7; color: #080c18; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ============================================================
   进入动画
   ============================================================ */
.reveal {
  opacity: 0; transform: translateY(16px);
  transition: opacity .55s ease, transform .55s var(--ease);
}
.reveal.in { opacity: 1; transform: none; }

  function copyText(text) {
    const done = function () { showToast('邮箱已复制到剪贴板'); };
    const fail = function () { showToast('复制失败，请手动复制：' + text); };

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done).catch(function () {
        if (legacyCopy(text)) done(); else fail();
      });
    } else {
      if (legacyCopy(text)) done(); else fail();
    }
  }

  function legacyCopy(text) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) {
      return false;
    }
  }

  /* ==========================================================
     4. 通用 Tabs（ARIA + 键盘左右切换）
     ========================================================== */
  function buildTabs(mount, prefix, ariaLabel, tabs, renderPanel) {
    if (!mount || !tabs.length) return;

    const tablist = el('div', 'tablist');
    tablist.setAttribute('role', 'tablist');
    tablist.setAttribute('aria-label', ariaLabel);

    const panelsWrap = el('div');
    const tabEls = [];
    const panelEls = [];

    function select(index, focus) {
      tabEls.forEach(function (btn, i) {
        const on = i === index;
        btn.setAttribute('aria-selected', on ? 'true' : 'false');
        btn.tabIndex = on ? 0 : -1;
        panelEls[i].hidden = !on;
      });
      if (focus && tabEls[index]) tabEls[index].focus();
    }

    tabs.forEach(function (tab, i) {
      const tabId = prefix + '-tab-' + i;
      const panelId = prefix + '-panel-' + i;

      const btn = el('button', 'tab', tab.label);
      btn.type = 'button';
      btn.id = tabId;
      btn.setAttribute('role', 'tab');
      btn.setAttribute('aria-controls', panelId);
      btn.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
      btn.tabIndex = i === 0 ? 0 : -1;
      btn.addEventListener('click', function () { select(i, false); });

      const panel = el('div', 'tabpanel');
      panel.id = panelId;
      panel.setAttribute('role', 'tabpanel');
      panel.setAttribute('aria-labelledby', tabId);
      panel.setAttribute('tabindex', '0');
      panel.setAttribute('data-label', tab.label);
      panel.hidden = i !== 0;

      renderPanel(panel, tab, i);

      tabEls.push(btn);
      panelEls.push(panel);
      tablist.appendChild(btn);
      panelsWrap.appendChild(panel);
    });

    tablist.addEventListener('keydown', function (e) {
      const current = tabEls.indexOf(document.activeElement);
      if (current < 0) return;

      let next = -1;
      if (e.key === 'ArrowRight') next = (current + 1) % tabEls.length;
      else if (e.key === 'ArrowLeft') next = (current - 1 + tabEls.length) % tabEls.length;
      else if (e.key === 'Home') next = 0;
      else if (e.key === 'End') next = tabEls.length - 1;

      if (next >= 0) {
        e.preventDefault();
        select(next, true);
      }
    });

    mount.appendChild(tablist);
    mount.appendChild(panelsWrap);
  }

      if (item.tags && item.tags.length) {
        const tags = el('div', 'tags');
        item.tags.forEach(function (t) { tags.appendChild(el('span', 'tag', t)); });
        card.appendChild(tags);
      }

      wrapItem.appendChild(card);
      tl.appendChild(wrapItem);
    });

    panel.appendChild(tl);
  }

  function renderExperience() {
    const mount = $('#expTabs');
    if (!mount) return;

    const groups = (resume.experience || []).filter(function (g) {
      return g && g.items && g.items.length;
    });

    if (!groups.length) {
      const sec = document.getElementById('experience');
      if (sec) sec.hidden = true;
      return;
    }

    buildTabs(mount, 'exp', '经历分类', groups, function (panel, group) {
      renderTimeline(panel, group.items);
    });
  }

  /* ==========================================================
     6. 项目
     ========================================================== */
  function renderProjectCard(project) {
    const card = el('article', 'card proj');

    const head = el('div', 'proj-head');
    head.appendChild(el('h3', 'proj-name', project.name));
    head.appendChild(el('span', 'proj-period', project.period));
    card.appendChild(head);

    if (project.role) card.appendChild(el('p', 'proj-role', project.role));
    if (project.desc) card.appendChild(el('p', 'proj-desc', project.desc));

    if (project.points && project.points.length) {
      const ul = el('ul', 'points');
      project.points.forEach(function (p) { ul.appendChild(el('li', null, p)); });
      card.appendChild(ul);
    }

    if (project.stack && project.stack.length) {
      const tags = el('div', 'tags');
      project.stack.forEach(function (t) { tags.appendChild(el('span', 'tag', t)); });
      card.appendChild(tags);
    }

    return card;
  }

  function renderProjects() {
    const mount = $('#projTabs');
    if (!mount) return;

    const all = resume.projects || [];
    if (!all.length) {
      const sec = document.getElementById('projects');
      if (sec) sec.hidden = true;
      return;
    }

    const CAT_LABEL = {
      tech: '工程与竞赛',
      creative: '内容与创作',
      other: '其他'
    };

    const seen = {};
    const tabs = [{ id: 'all', label: '全部' }];
    all.forEach(function (p) {
      const c = p.category || 'other';
      if (!seen[c]) {
        seen[c] = true;
        tabs.push({ id: c, label: CAT_LABEL[c] || c });
      }
    });

    buildTabs(mount, 'proj', '项目分类', tabs, function (panel, tab) {
      const list = tab.id === 'all'
        ? all
        : all.filter(function (p) { return (p.category || 'other') === tab.id; });

      const grid = el('div', 'proj-grid');
      list.forEach(function (p, i) {
        grid.appendChild(reveal(renderProjectCard(p), i * 55));
      });
      panel.appendChild(grid);
    });
  }

  /* ==========================================================
     7. 技能矩阵
     ========================================================== */
  function renderSkills() {
    const mount = $('#skillGrid');
    if (!mount) return;

    const groups = resume.skills || [];
    if (!groups.length) {
      const sec = document.getElementById('skills');
      if (sec) sec.hidden = true;
      return;
    }

    const barIO = ('IntersectionObserver' in window)
      ? new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (!entry.isIntersecting) return;
            const fill = entry.target;
            fill.style.width = (fill.getAttribute('data-level') || 0) + '%';
            barIO.unobserve(fill);
          });
        }, { threshold: .2 })
      : null;

    groups.forEach(function (group, gi) {
      const card = el('div', 'card skill-card');
      card.appendChild(el('h3', 'skill-group', group.group));

      (group.items || []).forEach(function (item) {
        const row = el('div', 'skill-row');

        const label = el('div', 'skill-label');
        label.appendChild(el('span', null, item.name));
        label.appendChild(el('span', 'skill-pct', item.level + '%'));
        row.appendChild(label);

        const bar = el('div', 'bar');
        const fill = el('div', 'bar-fill');
        fill.setAttribute('data-level', item.level);
        fill.style.setProperty('--w', item.level + '%');
        bar.appendChild(fill);
        row.appendChild(bar);

        card.appendChild(row);

        if (barIO) barIO.observe(fill);
        else fill.style.width = item.level + '%';
      });

      mount.appendChild(reveal(card, gi * 60));
    });
  }

  /* ==========================================================
     8. ★ 作品集
     ========================================================== */
  function makeGalleryItem(item, siblings, idx) {
    const fig = el('figure', 'gallery-item');
    fig.tabIndex = 0;
    fig.setAttribute('role', 'button');
    fig.setAttribute('aria-label', '查看大图：' + (item.title || item.src));

    const img = el('img');
    img.src = item.src;
    img.alt = item.title || '';
    img.loading = 'lazy';
    img.decoding = 'async';

    /* 加载失败 → 切换为占位样式，避免出现破图 */
    img.addEventListener('error', function () {
      fig.classList.add('is-error');
      fig.setAttribute('aria-label', '图片缺失：' + (item.title || item.src));
      fig.tabIndex = -1;
    });

    const cap = el('figcaption', 'gallery-cap', item.title || '');

    const ph = el('div', 'gallery-ph');
    ph.innerHTML = ICON.image + '<span>' + (item.title || item.src) + '</span>';

    fig.appendChild(img);
    fig.appendChild(cap);
    fig.appendChild(ph);

    function open() {
      if (fig.classList.contains('is-error')) return;
      openLightbox(siblings, idx);
    }

    fig.addEventListener('click', open);
    fig.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
        e.preventDefault();
        open();
      }
    });

    return fig;
  }

  function renderGallery() {
    const mount = $('#galleryTabs');
    if (!mount) return;

    const cats = ((resume.gallery && resume.gallery.categories) || []).filter(function (c) {
      return c && c.items && c.items.length;
    });

    if (!cats.length) {
      const sec = document.getElementById('gallery');
      if (sec) sec.hidden = true;
      return;
    }

    buildTabs(mount, 'gal', '作品集分类', cats, function (panel, cat) {
      const grid = el('div', 'gallery-grid');
      cat.items.forEach(function (item, i) {
        grid.appendChild(makeGalleryItem(item, cat.items, i));
      });
      panel.appendChild(grid);
    });
  }

  /* ==========================================================
     9. ★ Lightbox 大图查看器
     ========================================================== */
  const lbState = { items: [], index: 0 };
  let lbLastFocus = null;

  function openLightbox(items, index) {
    const lb = $('#lightbox');
    if (!lb || !items.length) return;

    lbLastFocus = document.activeElement;
    lbState.items = items;
    lbState.index = index;

    updateLightbox();

    lb.classList.add('show');
    lb.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';

    const closeBtn = $('#lbClose');
    if (closeBtn) closeBtn.focus();
  }

  function closeLightbox() {
    const lb = $('#lightbox');
    if (!lb) return;

    lb.classList.remove('show');
    lb.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';

    if (lbLastFocus && typeof lbLastFocus.focus === 'function') {
      lbLastFocus.focus();
      lbLastFocus = null;
    }
  }

  function updateLightbox() {
    const items = lbState.items;
    if (!items.length) return;

    const item = items[lbState.index];
    const img = $('#lbImg');
    const cap = $('#lbCap');
    const count = $('#lbCount');

    if (img) {
      img.src = item.src;
      img.alt = item.title || '';
    }
    if (cap) cap.textContent = item.title || '';
    if (count) count.textContent = (lbState.index + 1) + ' / ' + items.length;

    const onlyOne = items.length < 2;
    const prev = $('#lbPrev');
    const next = $('#lbNext');
    if (prev) prev.disabled = onlyOne;
    if (next) next.disabled = onlyOne;
  }

  function lbNav(delta) {
    const items = lbState.items;
    if (items.length < 2) return;
    lbState.index = (lbState.index + delta + items.length) % items.length;
    updateLightbox();
  }

  function setupLightbox() {
    const lb = $('#lightbox');
    if (!lb) return;

    const closeBtn = $('#lbClose');
    const prevBtn = $('#lbPrev');
    const nextBtn = $('#lbNext');

    if (closeBtn) closeBtn.addEventListener('click', closeLightbox);
    if (prevBtn) prevBtn.addEventListener('click', function (e) { e.stopPropagation(); lbNav(-1); });
    if (nextBtn) nextBtn.addEventListener('click', function (e) { e.stopPropagation(); lbNav(1); });

    /* 点击遮罩空白处关闭 */
    lb.addEventListener('click', function (e) {
      if (e.target === lb) closeLightbox();
    });

    /* 键盘：Esc 关闭 / ← → 切换 */
    document.addEventListener('keydown', function (e) {
      if (!lb.classList.contains('show')) return;
      if (e.key === 'Escape') { e.preventDefault(); closeLightbox(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); lbNav(-1); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); lbNav(1); }
    });

    /* 移动端滑动手势 */
    let startX = 0, startY = 0, tracking = false;
    lb.addEventListener('touchstart', function (e) {
      if (e.touches.length !== 1) return;
      tracking = true;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    }, { passive: true });

    lb.addEventListener('touchend', function (e) {
      if (!tracking || e.changedTouches.length !== 1) return;
      tracking = false;
      const dx = e.changedTouches[0].clientX - startX;
      const dy = e.changedTouches[0].clientY - startY;
      if (Math.abs(dx) > 56 && Math.abs(dx) > Math.abs(dy) * 1.4) {
        lbNav(dx < 0 ? 1 : -1);
      }
    }, { passive: true });
  }

  /* ==========================================================
     10. 教育与证书
     ========================================================== */
  function renderEducation() {
    const mount = $('#eduMount');
    if (!mount) return;

    const edu = resume.education;
    if (!edu) {
      const sec = document.getElementById('education');
      if (sec) sec.hidden = true;
      return;
    }

    const card = el('div', 'card edu-card');

    const top = el('div', 'edu-top');
    const left = el('div');
    left.appendChild(el('h3', 'edu-school', edu.school));
    left.appendChild(el('p', 'edu-major', edu.major));
    top.appendChild(left);
    top.appendChild(el('span', 'edu-period', edu.period));
    card.appendChild(top);

    const grid = el('div', 'edu-grid');

    if (edu.courses && edu.courses.length) {
      const block = el('div', 'edu-block');
      block.appendChild(el('h4', null, '核心课程'));
      const chips = el('div', 'chips');
      edu.courses.forEach(function (c) { chips.appendChild(el('span', 'chip', c)); });
      block.appendChild(chips);
      grid.appendChild(block);
    }

    if (isFilled(edu.background)) {
      const block = el('div', 'edu-block');
      block.appendChild(el('h4', null, '学业背景'));
      block.appendChild(el('p', 'edu-text', edu.background));
      grid.appendChild(block);
    }

    if (isFilled(edu.plan)) {
      const block = el('div', 'edu-block');
      block.appendChild(el('h4', null, '学业规划'));
      block.appendChild(el('p', 'edu-text', edu.plan));
      grid.appendChild(block);
    }

    if (grid.children.length) card.appendChild(grid);

    mount.appendChild(reveal(card));
  }

  function renderAwards() {
    const mount = $('#awardGrid');
    if (!mount) return;

    const list = (resume.awards || []).filter(function (a) {
      return a && isFilled(a.title);
    });

    if (!list.length) {
      const sub = $('.sub-head');
      if (sub) sub.hidden = true;
      mount.hidden = true;
      return;
    }

    list.forEach(function (award, i) {
      const item = el('div', 'award');

      const icon = el('div', 'award-icon');
      icon.innerHTML = ICON.award;
      item.appendChild(icon);

      const body = el('div', 'award-body');

      const title = el('div', 'award-title');
      title.appendChild(el('span', null, award.title));
      if (isFilled(award.issuer)) {
        title.appendChild(el('span', 'award-issuer', award.issuer));
      }
      body.appendChild(title);

      if (isFilled(award.desc)) body.appendChild(el('p', 'award-desc', award.desc));
      if (isFilled(award.meta)) body.appendChild(el('p', 'award-meta', award.meta));

      item.appendChild(body);
      mount.appendChild(reveal(item, i * 60));
    });
  }

  /* ==========================================================
     11. 主题切换
     ========================================================== */
  const root = document.documentElement;

  function applyTheme(theme) {
    root.setAttribute('data-theme', theme);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'dark' ? '#080c18' : '#4f46e5');
    const btn = $('#themeBtn');
    if (btn) {
      btn.setAttribute('aria-label', theme === 'dark' ? '切换到浅色模式' : '切换到深色模式');
    }
  }

  function setupTheme() {
    const btn = $('#themeBtn');
    if (!btn) return;

    let current = safeGet('lq-theme');
    if (!current) {
      current = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    applyTheme(current);

    btn.addEventListener('click', function () {
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      safeSet('lq-theme', next);
      showToast(next === 'dark' ? '已切换到深色模式' : '已切换到浅色模式');
    });
  }

  /* ==========================================================
     12. 打印 / 返回顶部
     ========================================================== */
  function setupPrint() {
    const btn = $('#printBtn');
    if (!btn) return;
    btn.addEventListener('click', function () { window.print(); });
  }

  function setupToTop() {
    const btn = $('#toTop');
    if (!btn) return;

    let ticking = false;
    function update() {
      btn.classList.toggle('show', window.scrollY > 420);
      ticking = false;
    }

    window.addEventListener('scroll', function () {
      if (!ticking) {
        ticking = true;
        window.requestAnimationFrame(update);
      }
    }, { passive: true });

    btn.addEventListener('click', function () {
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
    });

    update();
  }

  /* ==========================================================
     13. 初始化
     ========================================================== */
  function init() {
    renderNav();
    renderHero();
    renderHighlights();
    renderExperience();
    renderProjects();
    renderSkills();
    renderGallery();
    setupLightbox();
    renderEducation();
    renderAwards();
    setupTheme();
    setupPrint();
    setupToTop();
    setupScrollSpy();

    const yearEl = $('#year');
    if (yearEl) yearEl.textContent = String(new Date().getFullYear());
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
